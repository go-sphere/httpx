name: Build

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            ginx/go.sum
            fiberx/go.sum
            echox/go.sum
            hertzx/go.sum
            conformance/go.sum
      - name: Create Go workspace
        run: go work init . ./ginx ./fiberx ./echox ./hertzx ./conformance
      - name: Check
        run: make check
