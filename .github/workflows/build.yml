name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      # go.work is gitignored, and without it every adapter resolves
      # github.com/go-sphere/httpx from the proxy — which does not yet have the
      # symbols they use. `make work` builds the workspace from the Makefile's
      # module list, so adding a module cannot leave this step behind.
      - name: Create Go workspace
        run: make work

      # Dependency hygiene per module (GOWORK=off, so each go.mod is checked as
      # a consumer sees it), then compile and test every module through the
      # workspace. `make check` adds format/vet/golangci-lint/nilaway and the
      # race detector for local use; CI deliberately stops at build + test, so
      # it needs no linter toolchain.
      - name: Check dependencies
        run: make tidy-check
      - name: Build
        run: make build
      - name: Test
        run: make test
